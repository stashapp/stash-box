#import "../fragments/QueryGalleryFragment.gql"
query StudioPerformerGalleries(
  $studioId: ID!
  $performerId: ID!
  $page: Int!
  $per_page: Int!
) {
  findPerformer(id: $performerId) {
    id
    queryGalleries(
      input: {
        studios: { modifier: INCLUDES, value: [$studioId] }
        page: $page
        per_page: $per_page
        sort: DATE
        direction: DESC
      }
    ) {
      galleries {
        ...QueryGalleryFragment
      }
    }
  }
}
