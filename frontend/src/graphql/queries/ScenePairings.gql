#import "../fragments/ImageFragment.gql"
#import "../fragments/PairingSceneFragment.gql"
query ScenePairings(
  $performerId: ID!
  $names: String
  $gender: GenderFilterEnum
  $favorite: Boolean
  $page: Int! = 1
  $per_page: Int! = 25
  $direction: SortDirectionEnum!
  $sort: PerformerSortEnum!
  $fetchScenes: Boolean!
  $scenesPerPage: Int! = 12
) {
  queryPerformers(
    input: {
      performed_with: $performerId
      names: $names
      gender: $gender
      is_favorite: $favorite
      page: $page
      per_page: $per_page
      direction: $direction
      sort: $sort
    }
  ) {
    count
    performers {
      id
      name
      deleted
      gender
      is_favorite
      images {
        ...ImageFragment
      }
      queryScenes(
        input: {
          performers: { modifier: INCLUDES_ALL, value: [$performerId] }
          page: 1
          per_page: $scenesPerPage
          sort: DATE
          direction: DESC
        }
      ) {
        count
        scenes @include(if: $fetchScenes) {
          ...PairingSceneFragment
        }
      }
    }
  }
}
